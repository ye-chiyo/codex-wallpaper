name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install locked dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & pnpm.cmd install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed with exit code $LASTEXITCODE."
          }

      - name: Verify Edge test dependency
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if (-not (Test-Path -LiteralPath $edge -PathType Leaf)) {
            throw "Edge is unavailable at the path required by the browser fixtures: $edge"
          }
          $version = (Get-Item -LiteralPath $edge).VersionInfo.ProductVersion
          Write-Host "Edge test dependency: $version at $edge"
          Write-Host "Node: $(& node.exe --version)"
          Write-Host "pnpm: $(& pnpm.cmd --version)"

      - name: Run Node tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & pnpm.cmd test
          if ($LASTEXITCODE -ne 0) {
            throw "Node tests failed with exit code $LASTEXITCODE."
          }
          Write-Host 'Node tests passed.'

      - name: Run PowerShell launcher tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'desktop-entry.test.ps1',
            'profile-preflight.test.ps1',
            'startup-entry.test.ps1',
            'startup-roots.test.ps1'
          )
          $failed = @()
          foreach ($name in $tests) {
            Write-Host "::group::PowerShell fixture $name"
            & powershell.exe -NoProfile -File (Join-Path 'launcher' $name)
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0) {
              Write-Host "PowerShell fixture $name failed with exit code $code." -ForegroundColor Red
              $failed += "$name ($code)"
            } else {
              Write-Host "PowerShell fixture $name passed."
            }
          }
          if ($failed.Count) {
            throw "PowerShell launcher tests failed: $($failed -join ', ')"
          }
          Write-Host 'PowerShell launcher tests passed.'
