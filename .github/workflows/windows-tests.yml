name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install locked dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & pnpm.cmd install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed with exit code $LASTEXITCODE."
          }

      - name: Install ffmpeg test dependency
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ffmpeg.exe -CommandType Application -ErrorAction SilentlyContinue)) {
            & choco install ffmpeg --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) {
              throw "ffmpeg installation failed with exit code $LASTEXITCODE."
            }
          }
          $ffmpeg = Get-Command ffmpeg.exe -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $ffmpeg) {
            throw 'ffmpeg.exe is still unavailable after installation.'
          }
          Write-Host "ffmpeg test dependency: $($ffmpeg.Source)"

      - name: Run full Windows test suite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & pnpm.cmd test:full
          if ($LASTEXITCODE -ne 0) {
            throw "Full Windows test suite failed with exit code $LASTEXITCODE."
          }
